    ini_data_file: "mujoco_random_obstacles.npz"

models: 
    xpos: "svgp_dynamics_xpos_d_dt.pt"
    xpos_dot: "svgp_dynamics_xpos_dot_d_dt.pt"
    pitch: "svgp_dynamics_pitch_d_dt.pt"
    pitch_dot: "svgp_dynamics_pitch_dot_d_dt.pt"

gp:
